name: CI

# Runs on every push and PR. Three gates, cheapest first so a broken import or
# a lint slip fails in seconds rather than after the test database is built:
#
#   1. lint       — ruff (see [tool.ruff] in pyproject.toml)
#   2. migrations — models and migrations must not have drifted
#   3. tests      — the Django suite against a real PostgreSQL service
#
# All three run against the project's own pinned toolchain: `uv sync` installs
# from uv.lock, so CI tests the same dependency set a developer has locally.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run in flight; a PR update
# cancels the previous push's run too.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every value the test suite needs. `pwms.settings` reads all of these with
  # python-decouple; the LDAP and SharePoint settings are optional (they default
  # to empty) so a directory is not required to run the suite.
  #
  # These are throwaway CI values, not secrets — nothing here reaches production.
  # SECRET_KEY and the two identity-number keys exist only to satisfy startup:
  #   IDNO_HMAC_KEY is any string; IDNO_ENC_KEY must be a valid Fernet key, which
  #   is why a real one is checked in below rather than a placeholder.
  SECRET_KEY: ci-only-not-a-secret
  DEBUG: "False"
  PG_DB: pwms
  PG_USERNAME: postgres
  PG_PASSWORD: postgres
  PG_HOST: 127.0.0.1
  PG_PORT: "5432"
  IDNO_HMAC_KEY: ci-only-not-a-secret
  IDNO_ENC_KEY: FYUf0-vB7g8m1l6B2d9g0M6f1w7b9v2jK4pQ8sR3tE0=
  PWMS_BASE_URL: http://testserver
  DEFAULT_FROM_EMAIL: no-reply@example.org
  EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # python-ldap (pulled in by django-auth-ldap) ships no wheels, so it has
      # to compile from source — which needs the LDAP/SASL headers and Python's
      # own development headers. Without these, `uv sync --frozen` fails before
      # any job can run. (Same reason the project cannot sync on a bare machine.)
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libldap2-dev libsasl2-dev python3-dev build-essential

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # The project is pinned to Python 3.14; let uv fetch and manage
          # an interpreter that ships with headers (the runner's system
          # python3 may not).
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      # The codebase currently carries pre-existing lint findings (see the note
      # in the README/roadmap). Until those are cleared, this job reports them
      # without failing the build, so CI is useful on day one instead of red.
      # Flip `continue-on-error` to `false` once `uv run ruff check` is clean to
      # make lint a hard gate.
      - name: ruff check
        continue-on-error: true
        run: uv run ruff check src/pwms

      - name: ruff format --check
        continue-on-error: true
        run: uv run ruff format --check src/pwms

  migrations:
    name: Migrations up to date
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pwms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # python-ldap needs LDAP/SASL + Python headers to compile (no wheels).
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libldap2-dev libsasl2-dev python3-dev build-essential

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      # A model changed without a matching migration is a real bug: the schema
      # and the code disagree, and production would silently diverge. This gate
      # is the point of CI.
      #
      # NOTE: as of writing, `makemigrations --check` reports pre-existing drift
      # (26 AlterField operations on the workflow models, regenerated under
      # Django 6.1). That is a real outstanding task, not noise — but failing
      # every build for a condition that already exists just trains people to
      # ignore CI. So the drift is reported here and the job is allowed to
      # continue; commit the generated migration, then set
      # `continue-on-error: false` to make this a hard gate.
      - name: makemigrations --check --dry-run
        continue-on-error: true
        run: |
          uv run python manage.py makemigrations --check --dry-run --verbosity 2

      - name: migrate (apply against the service database)
        run: uv run python manage.py migrate --no-input

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is ">=3.14"; 3.14 is the floor, and listing it alone
        # keeps CI honest about the version the project is actually developed on.
        python-version: ["3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pwms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # python-ldap needs LDAP/SASL + Python headers to compile (no wheels).
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libldap2-dev libsasl2-dev python3-dev build-essential

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: |
          uv run coverage run --source=pwms manage.py test \
            pwms.tests \
            pwms.tests_api \
            pwms.tests_attachments \
            pwms.tests_authentication \
            pwms.tests_detail \
            pwms.tests_detail_actions \
            pwms.tests_executive \
            pwms.tests_messages \
            pwms.tests_ninja \
            pwms.tests_notifications \
            pwms.tests_referral_access \
            pwms.tests_referrals \
            pwms.tests_reports \
            pwms.tests_transitions

      - name: Coverage report
        run: uv run coverage report --show-missing

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore
