[project]
name = "pwms-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gavin Elie", email = "gavin.elie@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "django>=6.1.1",
    "django-background-tasks>=1.2.8",
    "django-extensions>=4.1",
    "django-flatpickr>=2.1.0",
    "django-htmx>=1.29.0",
    "django-mptt>=0.18.0",
    "djlint>=1.46.1",
    "lucide[django]>=1.1.4",
    "openpyxl>=3.1.5",
    "oracledb>=4.0.2",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "python-decouple>=3.8",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "weasyprint>=69.0",
]

[project.scripts]
pwms-project = "pwms_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
