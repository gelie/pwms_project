{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="description"
          content="PWMS - Parliament Workflow Management System">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="{% static "images/favicon/apple-touch-icon.png" %}">
    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="{% static "images/favicon/favicon-32x32.png" %}">
    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="{% static "images/favicon/favicon-16x16.png" %}">
    {# Load CSS and JavaScript #}
    <link rel="stylesheet" href="{% static "css/bootstrap.min.css" %}">
    <link rel="stylesheet" href="{% static "css/parl-light-dark.css" %}">
    <link rel="stylesheet" href="{% static "css/style.css" %}">
    <link rel="stylesheet" href="{% static "css/fonts.css" %}">
    <script src="{% static "js/bootstrap.bundle.min.js" %}" defer></script>
    <title>PWMS</title>
  </head>
  <body>
    {% include "header.html" %}
    {% include "navbar.html" %}
    {% block content %}
    {% endblock content %}
    <div id="site-footer">
      <p>
        Made with {% lucide "heart" fill="red" stroke="red" %}
        for the Parliament of South Africa {% lucide "move-right" %} @<span id="current-year"></span>
      </p>
    </div>
    <script>
      function getCurrentYear() {
        return new Date().getFullYear();
      }

      // The footer markup is already parsed at this point, so the function can
      // be called directly to fill in the year.
      document.getElementById("current-year").textContent = getCurrentYear();
    </script>
  </body>
</html>
