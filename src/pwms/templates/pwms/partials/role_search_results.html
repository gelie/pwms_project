{% for role in roles %}
  <button type="button"
          class="list-group-item list-group-item-action"
          onclick="selectOption('{{ role.pk }}', '{{ role.name|escapejs }}')">
    <span class="fw-medium">{{ role.name }}</span>
    {% if role.description %}
      <span class="d-block small text-body-secondary">{{ role.description }}</span>
    {% endif %}
  </button>
{% empty %}
  <div class="list-group-item small text-body-secondary">No roles found matching your search</div>
{% endfor %}
