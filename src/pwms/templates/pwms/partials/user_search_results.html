{% for user in users %}
  <button type="button"
          class="list-group-item list-group-item-action"
          onclick="selectUser('{{ user.pk }}', '{{ user.username|escapejs }}', '{{ user.display_name|escapejs }}')">
    <span class="fw-medium d-flex align-items-center gap-2">
      {% if user.is_mp %}
        <span class="badge bg-primary">MP</span>
      {% else %}
        <span class="badge bg-body-tertiary text-body">Staff</span>
      {% endif %}
      {{ user.display_name }}
    </span>
    <span class="d-block small text-body-secondary">@{{ user.username }}</span>
  </button>
{% empty %}
  <div class="list-group-item small text-body-secondary">No users found matching your search</div>
{% endfor %}
