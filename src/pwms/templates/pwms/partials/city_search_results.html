{% for city in cities %}
  <button type="button"
          class="list-group-item list-group-item-action"
          onclick="selectOption('{{ city.pk }}', '{{ city.name|escapejs }}')">
    <span class="fw-medium">{{ city.name }}</span>
    <span class="d-block small text-body-secondary">
      {{ city.country.name }}{% if city.population %} · {{ city.population }} residents{% endif %}
    </span>
  </button>
{% empty %}
  <div class="list-group-item small text-body-secondary">No cities found matching your search</div>
{% endfor %}
