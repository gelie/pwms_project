{% extends "base.html" %}
{% block content %}
  <div class="py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card">
          <div class="card-header">
            <h1 class="h4 mb-0">Sign out</h1>
          </div>
          <div class="card-body p-4">
            {% if user.is_authenticated %}
              <p class="mb-4">
                You are signed in as <strong>{{ user.get_username }}</strong>.
                Are you sure you want to sign out?
              </p>
              <form method="post" action="{% url 'pwms:logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary w-100">Sign out</button>
              </form>
              <a class="btn btn-secondary w-100 mt-2" href="{% url 'pwms:home' %}">Cancel</a>
            {% else %}
              <p class="mb-4">You are not signed in.</p>
              <a class="btn btn-primary w-100" href="{% url 'pwms:login' %}">Sign in</a>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
